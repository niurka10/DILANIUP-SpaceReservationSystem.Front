<aside class="sidebar d-flex flex-column">
  <div class="brand d-flex align-items-center gap-2">
    <div class="mark"></div>
    <div class="word">
      UNIB·E
      <small>Reservas</small>
    </div>
  </div>

  <div class="navgroup-label">Menú</div>

  <nav class="nav flex-column flex-grow-1">
    <a routerLink="/dashboard" routerLinkActive="active" class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
        <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
      </svg>
      Dashboard
    </a>

    <a routerLink="/users" routerLinkActive="active" class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Usuarios
    </a>

    <a routerLink="/reservations" routerLinkActive="active" class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
      </svg>
      Reservas (todas)
    </a>

    <a routerLink="/spaces-resources" routerLinkActive="active" class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z"/><path d="M3.3 8.7 12 13l8.7-4.3M12 13v8"/>
      </svg>
      Espacios y Recursos
    </a>

    <a routerLink="/alerts" routerLinkActive="active" class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
        <path d="M12 9v4M12 17h.01"/>
      </svg>
      Alertas
    </a>

    <a routerLink="/reports" routerLinkActive="active" class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/>
        <rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>
      </svg>
      Reportes
    </a>
  </nav>

  <div class="sidebar-foot">
    @if (authService.currentUser(); as user) {
      <div class="userchip">
        <div class="avatar">{{ initials(user.email) }}</div>
        <div>
          <div class="u-name text-truncate" style="max-width: 150px;">{{ user.email }}</div>
          <div class="u-role">{{ user.role }}</div>
        </div>
      </div>
    }
    <button class="logout-btn" (click)="authService.logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      Cerrar sesión
    </button>
  </div>
</aside>
